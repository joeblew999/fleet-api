# The fleet device API from the Go contract. openapi.json and asyncapi.json are written by `mise run spec`
# from api/contract.go (never by hand). What Fern needs (SDK names, x-fern-pagination,
# x-fern-streaming) is declared there; the WebSocket channel comes from the Go library's asyncapi package.
api:
  specs:
    - openapi: openapi.json
    - asyncapi: asyncapi.json
  # How the SDKs authenticate: each operation's own security in the spec (endpoint-security: any one
  # requirement, all the schemes within it), over these schemes. They restate the contract's
  # (api/auth.go), which Fern needs here before it routes per operation; TestFernAuthMatchesTheContract
  # keeps the two the same. Unset, an operation's security that equals the spec's default is dropped,
  # so the contract sets none and every operation says its own.
  auth-schemes:
    accessClientId:
      header: CF-Access-Client-Id
      name: accessClientId
      env: FLEET_API_ACCESS_CLIENT_ID
    accessClientSecret:
      header: CF-Access-Client-Secret
      name: accessClientSecret
      env: FLEET_API_ACCESS_CLIENT_SECRET
    oidc:
      scheme: bearer
      token:
        name: accessToken
        env: FLEET_API_ACCESS_TOKEN
    bearer:
      scheme: bearer
      token:
        name: token
        env: FLEET_API_TOKEN
  auth:
    endpoint-security: {}

# The groups (mise run sdk:list).
# Generate one: mise run sdk:gen <group>   (output: sdk/out/<group>)
groups:
  # The Go SDK.
  go:
    generators:
      - name: fernapi/fern-go-sdk
        version: 1.64.0
        output:
          location: local-file-system
          path: ../sdk/out/go
        config:
          # The project's module with /sdk/go added: the folder `mise run sdk:publish` commits this SDK to,
          # so another repo can go get it.
          module:
            path: github.com/joeblew999/fleet-api/sdk/go
            version: "1.22"
          packageName: fleet

  # The TypeScript SDK as sources (.ts): what a release ships.
  typescript:
    generators:
      - name: fernapi/fern-typescript-sdk
        version: 3.98.0
        output:
          location: local-file-system
          path: ../sdk/out/typescript
        config:
          # The serde layer: serialization.DeviceReport.parse() checks a report as JSON against the
          # schema (types, enums, required fields) before it is posted, and the client checks again.
          noSerdeLayer: false
          namespaceExport: Fleet
          generateWebSocketClients: true
          # Workers (without nodejs_compat) have no `process`: guard the SDK's env lookups.
          guardProcessEnvAccess: true

  # The TypeScript SDK compiled (.js + .d.ts): what a Worker or a Node program imports, and what the tests use.
  typescript-dist:
    generators:
      - name: fernapi/fern-typescript-sdk
        version: 3.98.0
        output:
          location: local-file-system
          path: ../sdk/out/typescript-dist
        config:
          # The same SDK as the sources: with the serde layer.
          noSerdeLayer: false
          namespaceExport: Fleet
          generateWebSocketClients: true
          # Workers (without nodejs_compat) have no `process`: guard the SDK's env lookups.
          guardProcessEnvAccess: true
          outputSourceFiles: false

  # A Rust CLI for the API (Fern's CLI generator, early access).
  cli:
    generators:
      - name: fernapi/fern-cli-generator
        version: 0.45.1
        output:
          location: local-file-system
          path: ../sdk/out/cli
        config:
          binaryName: fleet
