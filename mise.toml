# A Go API on Cloudflare Workers, contract first: the contract (api/contract.go) is the source, and
# the server, the specs (fern/), the SDKs, a CLI and the API docs come from it.
#   mise install && mise run setup     # tools, then npm packages
#   mise run check                     # every local check (no Cloudflare account)
#   mise tasks                         # all of them
# Every task is one line that sh and Windows' cmd.exe both take: programs, "double quotes", &&. A
# setting is written {{env.NAME}}, which mise fills in itself. Anything else is a
# command of the charter tool, which works on the project it is run in (`help` lists its commands).

[tools]
# The tool every task runs, the release's binary: `mise up --bump github:joeblew999/charter` moves to a newer one.
"github:joeblew999/charter" = "0.12.0"
go = "1.27.1"
node = "26.10.0"
# Builds the generated CLI: mise run sdk:cli:build.
rust = "1.98.1"
# Link the CLI for the other systems a release ships it for: mise run sdk:dist:cli.
zig = "0.16.0"
"aqua:rust-cross/cargo-zigbuild" = "0.23.4"
gh = "2.101.0"
# The secrets: names in fnox.toml, values in the keychain. Tasks get them through fnox exec.
fnox = "1.36.0"

[env]
# How the tasks run the charter tool.
CHARTER_TOOL = "charter"
# The Worker's secrets: every mise run deploy sets them, from fnox (fnox.toml) or, in CI, from the
# repo's GitHub secrets. The local runs and tests use throwaway ones.
WORKER_SECRETS = "READ_TOKEN WRITE_TOKEN"
# The Worker's optional secrets: who else it trusts (Cloudflare Access, an OpenID Connect issuer).
# A deploy sets those the environment has (fnox has Access's); the rest stay unset, and the Worker
# trusts no one that way.
WORKER_OPTIONAL_SECRETS = "ACCESS_TEAM_DOMAIN ACCESS_AUD OIDC_ISSUER OIDC_AUDIENCE"
# The local dev port.
API_PORT = "{{ get_env(name='API_PORT', default='5174') }}"
# Where the Worker is deployed (cf deploy prints it; there is no cf command to look it up). Its first
# label is the Worker's name. If it is not this, set it in mise.local.toml (gitignored) or change
# the default here, then: mise run spec.
API_URL = "{{ get_env(name='API_URL', default='https://fleet-api.gedw99.workers.dev') }}"
# Optional: an API token instead of cf's OAuth login (`npx cf auth login`).
# CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
# Every fnox run here sees only the secrets fnox.toml declares for fleet-api, not the whole global
# fnox config.
FNOX_PROFILE = "fleet-api"
FNOX_NO_DEFAULTS = "true"

[task_config]
# The tasks every project shares, and those of its language: charter's tasks/ folder (a project
# includes it from GitHub, by tag). A task defined below takes the place of the shared one.
includes = ["git::https://github.com/joeblew999/charter.git//tasks/shared?ref=v0.12.0", "git::https://github.com/joeblew999/charter.git//tasks/go?ref=v0.12.0"]

# ---- the project ---------------------------------------------------------------------------------

[tasks.check]
description = "Every LOCAL check (no Cloudflare account): lint, tests, spec drift, the TinyGo build, the live, MCP and auth tests natively and under workerd, and what is generated matches"
depends = ["lint", "test", "spec:check", "sdk:publish:fresh", "test:native", "test:workerd", "workflows:check", "docs:check"]

# ---- the API: run it, build it, test it ----------------------------------------------------------

[tasks.lint]
description = "gofmt and go vet, for the host and for Wasm"
run = "{{env.CHARTER_TOOL}} lint -wasm . *.go api cmd"

[tasks."test:native"]
description = "The live test, the MCP client test and the auth test (Access and OIDC from a test issuer it serves; a machine enrolled for 0000000000000001) against the native build, with throwaway tokens"
env = { READ_TOKEN = "local-read-token", WRITE_TOKEN = "local-write-token" }
run = '{{env.CHARTER_TOOL}} with-server -url http://localhost:{port}/api/hello -env PORT={port} -env ACCESS_TEAM_DOMAIN=http://localhost:{port2} -env ACCESS_AUD=test-aud -env OIDC_ISSUER=http://localhost:{port2} -env OIDC_AUDIENCE=https://fleet-api.test -env MACHINES=machine.access=0000000000000001 -start "go run ." -run "node test/live-test.mjs http://localhost:{port}" -run "node test/mcp-test.mjs http://localhost:{port}" -run "node test/auth-test.mjs http://localhost:{port} {port2}"'

[tasks."test:workerd"]
description = "The same against the TinyGo Wasm under workerd (go test can't see TinyGo's gaps, such as its crypto)"
env = { READ_TOKEN = "local-read-token", WRITE_TOKEN = "local-write-token" }
depends = ["build"]
run = '{{env.CHARTER_TOOL}} with-server -url http://localhost:{port}/api/hello -env PORT={port} -env ACCESS_TEAM_DOMAIN=http://localhost:{port2} -env ACCESS_AUD=test-aud -env OIDC_ISSUER=http://localhost:{port2} -env OIDC_AUDIENCE=https://fleet-api.test -start "cf dev" -run "{{env.CHARTER_TOOL}} migrate-local -port {port}" -run "node test/live-test.mjs http://localhost:{port}" -run "node test/mcp-test.mjs http://localhost:{port}" -run "node test/auth-test.mjs http://localhost:{port} {port2}"'

[tasks.mcp-test]
description = "The MCP client test (/api/mcp, official TypeScript client) against a running mise run run or mise run dev"
env = { READ_TOKEN = "local-read-token", WRITE_TOKEN = "local-write-token" }
run = 'node test/mcp-test.mjs http://localhost:{{env.API_PORT}}'

# ---- Cloudflare: deploy it, test and measure what is deployed ------------------------------------

[tasks.deploy]
description = "REMOTE: build and deploy the Worker with its secrets (WORKER_SECRETS, and the WORKER_OPTIONAL_SECRETS fnox has), then apply pending D1 migrations"
depends = ["build"]
run = "{{env.CHARTER_TOOL}} exec -secrets {{env.CHARTER_TOOL}} deploy"

[tasks.live-test]
description = "REMOTE, posts the test machine's report (0000000000000001): every route raw, through the generated TypeScript SDK, then MCP, with the test machine's Access service token from fnox"
depends = ["sdk:ready typescript-dist"]
run = '{{env.CHARTER_TOOL}} exec -secrets node test/live-test.mjs {{env.API_URL}} && {{env.CHARTER_TOOL}} exec -secrets node test/sdk-live-test.mjs {{env.API_URL}} && {{env.CHARTER_TOOL}} exec -secrets node test/mcp-test.mjs {{env.API_URL}}'

[tasks.bench]
description = "REMOTE, read-only: every GET operation of the deployed Worker: wall time, Cloudflare's CPU time, and the CPU of each request. Add -write to include the ones that change data"
run = "{{env.CHARTER_TOOL}} bench -each -warm 30s"

# ---- the machines: which device each Access service token posts for (fleet-api's own) ------------

[tasks."machine:enrol"]
description = "REMOTE: tie a machine's Access service token (mise run access:token -- create <machine> ...) to its device, the only one it may post for: mise run machine:enrol -- <machine> <device id>"
run = "fnox exec -- node scripts/machines.mjs {{env.API_URL}} enrol"

[tasks."machine:list"]
description = "REMOTE, read-only: each machine's service token, the device it posts for, and when it expires (no secret)"
run = "fnox exec -- node scripts/machines.mjs {{env.API_URL}} list"

[tasks."machine:forget"]
description = "REMOTE: untie a machine's token from its device (after mise run access:token -- revoke <machine>): mise run machine:forget -- <machine>"
run = "fnox exec -- node scripts/machines.mjs {{env.API_URL}} forget"
