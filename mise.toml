# A Go API on Cloudflare Workers, contract first: the contract (api/contract.go) is the source, and
# the server, the specs (fern/), the SDKs, a CLI and the API docs come from it.
#   mise install && mise run setup     # tools, then npm packages
#   mise run check                     # every local check (no Cloudflare account)
#   mise tasks                         # all of them
# Every task is one line that sh and Windows' cmd.exe both take: programs, "double quotes", &&. A
# setting is written {{env.NAME}}, which mise fills in itself. Anything else is a
# command of the charter tool, which works on the project it is run in (`help` lists its commands).

[tools]
# The tool every task runs: `mise up` moves to a newer release.
"go:github.com/joeblew999/charter/cmd/charter" = "0.9.1"
go = "1.27.1"
node = "26.10.0"
# Builds the generated CLI: mise run sdk:cli:build.
rust = "1.98.1"
gh = "2.101.0"
# The secrets: names in fnox.toml, values in the keychain. Tasks get them through fnox exec.
fnox = "1.36.0"

[env]
# The local dev port.
API_PORT = "{{ get_env(name='API_PORT', default='5174') }}"
# Where the Worker is deployed (cf deploy prints it; there is no cf command to look it up). Its first
# label is the Worker's name. If it is not this, set it in mise.local.toml (gitignored) or change
# the default here, then: mise run spec.
API_URL = "{{ get_env(name='API_URL', default='https://fleet-api.gedw99.workers.dev') }}"
# Optional: an API token instead of cf's OAuth login (`npx cf auth login`).
# CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
# Every fnox run here sees only the secrets fnox.toml declares for fleet-api, not the whole global
# fnox config.
FNOX_PROFILE = "fleet-api"
FNOX_NO_DEFAULTS = "true"

# ---- the project ---------------------------------------------------------------------------------

[tasks.setup]
description = "Install the npm packages: cf (Cloudflare's CLI), Fern's CLI, what the tests import"
run = "npm ci --no-fund --no-audit"

[tasks.check]
description = "Every LOCAL check (no Cloudflare account): lint, tests, spec drift, the TinyGo build, the live and MCP tests natively and under workerd, and what is generated matches"
depends = ["lint", "test", "spec:check", "sdk:publish:fresh", "test:native", "test:workerd", "workflows:check", "docs:check"]

[tasks.doctor]
description = "Check what the tasks need: npm packages, Docker, Go, Rust"
run = "charter doctor"

[tasks."upstream:status"]
description = "The upstream issues the code works around (every `Upstream:` tag): CLOSED means that workaround can go"
run = "charter upstream"

# ---- the API: run it, build it, test it ----------------------------------------------------------

[tasks.run]
description = "The API natively on API_PORT: no Cloudflare, an in-memory store, throwaway tokens"
env = { READ_TOKEN = "local-read-token", WRITE_TOKEN = "local-write-token" }
run = "charter exec -env PORT={{env.API_PORT}} go run ."

[tasks.build]
description = "Build the Worker's Wasm with TinyGo into build/, tuned for Workers, with the library's Worker glue beside it; fails over 3 MB gzipped"
run = "charter wasm-build"

[tasks.dev]
description = "The API under workerd on API_PORT (cf dev), throwaway tokens. First time: mise run migrate:local. After a Go change: mise run build"
env = { READ_TOKEN = "local-read-token", WRITE_TOKEN = "local-write-token" }
depends = ["build"]
run = "charter exec -env PORT={{env.API_PORT}} cf dev"

[tasks."migrate:local"]
description = "Apply migrations/ to the local D1 of a running mise run dev"
run = "charter migrate-local"

[tasks.spec]
description = "Write both specs from the contract (api/contract.go) into fern/"
run = 'go run ./cmd/spec fern/openapi.json fern/asyncapi.json {{env.API_URL}}'

[tasks."spec:check"]
description = "Fail if a committed spec is stale against the contract"
run = 'go run ./cmd/spec -check fern/openapi.json fern/asyncapi.json {{env.API_URL}}'

[tasks.lint]
description = "gofmt and go vet, for the host and for Wasm"
run = "charter lint -wasm . *.go api cmd test"

[tasks.test]
description = "Go tests: the API, the MCP endpoint, the contract's rules"
run = "go test ./..."

[tasks."test:native"]
description = "The live test and the MCP client test against the native build, with throwaway tokens"
env = { READ_TOKEN = "local-read-token", WRITE_TOKEN = "local-write-token", FLEET_API_READ_TOKEN = "local-read-token", FLEET_API_WRITE_TOKEN = "local-write-token" }
run = 'charter with-server -url http://localhost:{port}/api/hello -env PORT={port} -start "go run ." -run "node test/live-test.mjs http://localhost:{port}" -run "node test/mcp-test.mjs http://localhost:{port}"'

[tasks."test:workerd"]
description = "The same against the TinyGo Wasm under workerd (go test can't see TinyGo's gaps)"
env = { READ_TOKEN = "local-read-token", WRITE_TOKEN = "local-write-token", FLEET_API_READ_TOKEN = "local-read-token", FLEET_API_WRITE_TOKEN = "local-write-token" }
depends = ["build"]
run = 'charter with-server -url http://localhost:{port}/api/hello -env PORT={port} -start "cf dev" -run "charter migrate-local -port {port}" -run "node test/live-test.mjs http://localhost:{port}" -run "node test/mcp-test.mjs http://localhost:{port}"'

[tasks.mcp-test]
description = "The MCP client test (/api/mcp, official TypeScript client) against a running mise run run or mise run dev started with the same throwaway tokens"
env = { READ_TOKEN = "local-read-token", WRITE_TOKEN = "local-write-token", FLEET_API_READ_TOKEN = "local-read-token", FLEET_API_WRITE_TOKEN = "local-write-token" }
run = 'node test/mcp-test.mjs http://localhost:{{env.API_PORT}}'

# ---- Cloudflare: deploy it, test and measure what is deployed ------------------------------------

[tasks.deploy]
description = "REMOTE: build and deploy the Worker, then apply pending D1 migrations"
depends = ["build"]
run = "charter exec cf deploy && charter migrate"

[tasks.migrate]
description = "REMOTE: apply pending migrations/ to the Worker's D1 database"
run = "charter migrate"

[tasks.live-test]
description = "REMOTE, posts the test machine's report (0000000000000001): every route raw, through the generated TypeScript SDK, then MCP. The tokens from fnox"
depends = ["sdk:ready typescript-dist"]
run = 'fnox exec -- node test/live-test.mjs {{env.API_URL}} && fnox exec -- node test/sdk-live-test.mjs {{env.API_URL}} && fnox exec -- node test/mcp-test.mjs {{env.API_URL}}'

[tasks.bench]
description = "REMOTE, read-only: every GET operation of the deployed Worker: wall time, Cloudflare's CPU time, and the CPU of each request. Add -write to include the ones that change data"
run = "charter bench -each -warm 30s"

[tasks.perf]
description = "REMOTE, posts test reports: the quick loop for performance work: build, deploy, then bench the new isolate from its first request (8 at once, then each operation). About two minutes"
run = "mise run deploy && charter bench -each -burst 8 -write"

[tasks."perf:try"]
description = "REMOTE: try a change on a scratch Worker of its own and delete it after: mise run perf:try -- -name <experiment> [-build '<wasm-build flags>'] [-keep]. Several can run at once"
run = "charter perf"

[tasks."perf:clean"]
description = "REMOTE: delete the scratch Workers and databases that perf:try runs left"
run = "charter perf-clean"

[tasks."tokens:put"]
description = "REMOTE, once and after a rotation: set the Worker's READ_TOKEN and WRITE_TOKEN secrets from fnox (values are never printed)"
run = "fnox exec -- node scripts/put-tokens.mjs {{env.API_URL}}"

[tasks."cloudflare:secrets"]
description = "REMOTE, once per repo: copy CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID from fnox into the repo's GitHub secrets, for the deploy workflow"
run = "fnox exec -- charter github-secrets CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID"

[tasks."cloudflare:token"]
description = "Fail unless CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are set: what a deploy from GitHub needs (locally, cf auth login is enough)"
run = "charter need-env CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID"

# ---- sdk: what Fern generates from the specs in fern/ (its settings: fern/generators.yml) ---------

[tasks."sdk:list"]
description = "The SDK groups fern/generators.yml defines"
run = "charter sdk-list"

[tasks."sdk:check-spec"]
description = "Validate the specs and Fern's settings with Fern"
run = "charter exec fern check --warnings"

[tasks."sdk:gen"]
description = "Generate an SDK with Fern (Docker): mise run sdk:gen <group> -> sdk/out/<group>"
run = "charter sdk-gen"

[tasks."sdk:check"]
description = "Prove a generated SDK works (Go: build, vet, tests against WireMock; TypeScript: typecheck): mise run sdk:check <group>"
run = "charter sdk-check"

[tasks."sdk:ready"]
description = "Generate and build what the tests use, if missing (TypeScript and Go SDKs, the CLI): mise run sdk:ready [group...]"
run = "charter sdk-ready"

[tasks."sdk:publish"]
description = "Generate and check the Go SDK, then copy its sources into sdk/go, the committed module another repo can go get (Docker). Commit the result"
run = "charter sdk-publish"

[tasks."sdk:publish:check"]
description = "Fail if sdk/go is not what the committed specs generate now (Docker)"
run = "charter sdk-publish -check"

[tasks."sdk:publish:fresh"]
description = "Fail if the specs changed since sdk/go was made from them (no Docker: it compares a hash). sdk:publish:check proves the content"
run = "charter sdk-publish -check -quick"

[tasks."sdk:cli:build"]
description = "HEAVY: build the generated Rust CLI in sdk/out/cli: mise run sdk:cli:build [-linux]"
run = "charter cli-build"

[tasks."sdk:dist"]
description = "Generate, check and archive what a release ships into dist/: Go and TypeScript SDK sources, the specs (Docker)"
run = "charter dist-sdk"

[tasks."sdk:dist:cli"]
description = "HEAVY: generate and build the CLI into dist/: mise run sdk:dist:cli [-linux]"
run = "charter dist-cli"

[tasks."sdk:docs"]
description = "Preview the API's reference site locally (fern docs dev): http://localhost:3030"
# Fern runs its preview app from ~/.fern, outside the project: tell mise's shims which node to use there.
env = { MISE_NODE_VERSION = "26.10.0" }
run = "charter exec fern docs dev --port 3030"

[tasks."sdk:clean"]
description = "Remove generated SDKs (sdk/out) and stop leftover WireMock containers"
run = "charter sdk-clean"

# ---- the repo: releases, GitHub workflows, the docs site in docs/ --------------------------------

[tasks.release]
description = "REMOTE on a version tag (vX.Y.Z): attach dist/* to its GitHub Release. Anywhere else: a dry run that lists dist/"
run = "charter release"

[tasks."release:tags"]
description = "REMOTE on a version tag (vX.Y.Z): tag the committed Go SDK, a module in a subdirectory (sdk/go/vX.Y.Z). Anywhere else: a dry run"
run = "charter release-tags sdk/go"

[tasks.workflows]
description = "Write .github/workflows/ from the tool's templates (never edit the copies)"
run = "charter workflows"

[tasks."workflows:check"]
description = "Fail if a workflow in .github/workflows/ differs from the tool's template"
run = "charter workflows -check"

[tasks."docs:setup"]
description = "Write the docs site's config and docs/writing.md (the same for every repo; GitHub Pages renders the folder)"
run = "charter docs"

[tasks."docs:lint"]
description = "Check docs/ for what a program can check: front matter, links, the index, tasks and paths that don't exist"
run = "charter docs-lint"

[tasks."docs:check"]
description = "Fail if the docs site's config differs from what docs:setup writes, or docs/ fails the lint"
run = "charter docs -check && charter docs-lint"

[tasks."docs:review"]
description = "Have Claude (the claude command) bring docs/ up to date and into line with docs/writing.md"
run = "charter docs-review"

[tasks."docs:pages"]
description = "REMOTE, once per repo: turn on GitHub Pages for docs/ on main (GitHub renders the markdown itself)"
run = 'gh api -X POST "repos/{owner}/{repo}/pages" -f "source[branch]=main" -f "source[path]=/docs"'
