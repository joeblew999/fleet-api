#:schema https://fnox.jdx.dev/schema.json
# fleet-api's secrets: their names and where the values are kept (the keychain, service "fnox"),
# never a value, so this file is safe to commit. mise.toml selects the fleet-api profile alone
# (FNOX_PROFILE, FNOX_NO_DEFAULTS): a task under `fnox exec` gets these and nothing else from the
# global fnox config. The rules: https://github.com/joeblew999/claude-rig/blob/main/docs/concepts/secrets.md
root = true
# Into `fnox exec` commands only, never an interactive shell.
env = "exec"

# The same provider as the global fnox config, so this file also works without it.
[providers.keychain]
type = "keychain"
service = "fnox"

[profiles.fleet-api.secrets]
# This repo's own, named after it: one name for the fnox name, the keychain item and the variable
# the scripts read. On the Worker they are the secrets READ_TOKEN and WRITE_TOKEN (docs/guides/tokens.md).
FLEET_API_READ_TOKEN = { provider = "keychain", value = "FLEET_API_READ_TOKEN", description = "fleet-api: reads the fleet" }
FLEET_API_WRITE_TOKEN = { provider = "keychain", value = "FLEET_API_WRITE_TOKEN", description = "fleet-api: machines post reports" }
# Cloudflare Access (docs/guides/access.md): written by mise run access:setup and access:token, except
# the emails, which say who may log in. The client ID and secret are the test machine's service token,
# which the live test posts with.
FLEET_API_ACCESS_EMAILS = { provider = "keychain", value = "FLEET_API_ACCESS_EMAILS", description = "fleet-api: who may log in through Access, comma-separated" }
FLEET_API_ACCESS_APP_ID = { provider = "keychain", value = "FLEET_API_ACCESS_APP_ID", description = "fleet-api: the Access application's id" }
FLEET_API_ACCESS_AUD = { provider = "keychain", value = "FLEET_API_ACCESS_AUD", description = "fleet-api: the Access application's AUD tag (the Worker's ACCESS_AUD)" }
FLEET_API_ACCESS_CLIENT_ID = { provider = "keychain", value = "FLEET_API_ACCESS_CLIENT_ID", description = "fleet-api: the test machine's Access service token, Client ID" }
FLEET_API_ACCESS_CLIENT_SECRET = { provider = "keychain", value = "FLEET_API_ACCESS_CLIENT_SECRET", description = "fleet-api: the test machine's Access service token, Client Secret" }
# Shared, so plain names: tokens:put, cloudflare:secrets and the access tasks use them.
CLOUDFLARE_API_TOKEN = { provider = "keychain", value = "CLOUDFLARE_API_TOKEN" }
CLOUDFLARE_ACCOUNT_ID = { provider = "keychain", value = "CLOUDFLARE_ACCOUNT_ID" }
CF_ACCESS_TEAM_DOMAIN = { provider = "keychain", value = "CF_ACCESS_TEAM_DOMAIN" }
CF_ACCESS_GITHUB_IDP_ID = { provider = "keychain", value = "CF_ACCESS_GITHUB_IDP_ID" }
