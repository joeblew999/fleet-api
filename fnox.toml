#:schema https://fnox.jdx.dev/schema.json
# fleet-api's secrets: their names and where the values are kept (the keychain, service "fnox"),
# never a value, so this file is safe to commit. mise.toml selects the fleet-api profile alone
# (FNOX_PROFILE, FNOX_NO_DEFAULTS): a task under `fnox exec` gets these and nothing else from the
# global fnox config. The rules: https://github.com/joeblew999/claude-rig/blob/main/docs/concepts/secrets.md
root = true
# Into `fnox exec` commands only, never an interactive shell.
env = "exec"

# The same provider as the global fnox config, so this file also works without it.
[providers.keychain]
type = "keychain"
service = "fnox"

[profiles.fleet-api.secrets]
# Each name is what the tasks and the Worker read, the names charter uses (WORKER_SECRETS,
# WORKER_OPTIONAL_SECRETS, go/auth's settings); each value is a keychain item named after this repo,
# so the owner's keychain holds one item per repo and secret.
# The bearer tokens: the Worker's READ_TOKEN and WRITE_TOKEN, set by every mise run deploy (docs/guides/tokens.md).
READ_TOKEN = { provider = "keychain", value = "FLEET_API_READ_TOKEN", description = "fleet-api: reads the fleet" }
WRITE_TOKEN = { provider = "keychain", value = "FLEET_API_WRITE_TOKEN", description = "fleet-api: posts reports for any machine, forgets machines" }
# Cloudflare Access (docs/guides/access.md): the Worker's ACCESS_TEAM_DOMAIN and ACCESS_AUD, which every
# mise run deploy sets, and the application's id.
ACCESS_TEAM_DOMAIN = { provider = "keychain", value = "CF_ACCESS_TEAM_DOMAIN", description = "fleet-api: the Access team domain (the Worker's ACCESS_TEAM_DOMAIN)" }
ACCESS_AUD = { provider = "keychain", value = "FLEET_API_ACCESS_AUD", description = "fleet-api: the Access application's AUD tag (the Worker's ACCESS_AUD)" }
ACCESS_APP_ID = { provider = "keychain", value = "FLEET_API_ACCESS_APP_ID", description = "fleet-api: the Access application's id" }
# The test machine's service token (fleet-api:live-test), which the live tests post with: the
# names the SDKs read (go/auth's AccessScheme).
FLEET_API_ACCESS_CLIENT_ID = { provider = "keychain", value = "FLEET_API_ACCESS_CLIENT_ID", description = "fleet-api: the test machine's Access service token, Client ID" }
FLEET_API_ACCESS_CLIENT_SECRET = { provider = "keychain", value = "FLEET_API_ACCESS_CLIENT_SECRET", description = "fleet-api: the test machine's Access service token, Client Secret" }
# Shared, so plain names: deploy, cloudflare:secrets, the access and machine tasks use them.
CLOUDFLARE_API_TOKEN = { provider = "keychain", value = "CLOUDFLARE_API_TOKEN" }
CLOUDFLARE_ACCOUNT_ID = { provider = "keychain", value = "CLOUDFLARE_ACCOUNT_ID" }
CF_ACCESS_TEAM_DOMAIN = { provider = "keychain", value = "CF_ACCESS_TEAM_DOMAIN" }
CF_ACCESS_GITHUB_IDP_ID = { provider = "keychain", value = "CF_ACCESS_GITHUB_IDP_ID" }
